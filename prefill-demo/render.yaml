services:
  - type: web
    name: inqua-registration-handoff
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false # you'll be prompted for this at deploy time - your Atlas connection string
      - key: PARTICIPANT_BASE_URL
        value: https://demoinqua.cotrav.co.in
      - key: ENABLE_DEBUG_ROUTE
        value: "0"
